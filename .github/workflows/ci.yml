name: CI (Lint & Format)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo_dev
          POSTGRES_PASSWORD: nexo_1234
          POSTGRES_DB: nexo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Check code linting
        run: uv run ruff check .

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://nexo_dev:nexo_1234@localhost:5432/nexo_db
        run: uv run alembic upgrade head

      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexo_dev:nexo_1234@localhost:5432/nexo_db
        run: uv run pytest -v
