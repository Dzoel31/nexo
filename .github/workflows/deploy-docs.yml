name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Diperbarui ke v7 untuk keamanan ekstra pada sistem checkout
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Menggunakan setup-uv versi terbaru v6 (Sama seperti berkas CI Anda)
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Mengunduh Python versi 3.14 menggunakan toolchain uv langsung
      - name: Set up Python
        run: uv python install 3.14

      # Memasang dependensi secara otomatis (Aturan exclude-newer 7 hari otomatis berjalan di sini)
      - name: Install dependencies
        run: uv sync

      # Menjalankan Zensical build via uv run agar menggunakan environment yang terisolasi
      - name: Build documentation
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
